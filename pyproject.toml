[project]
name = "telegram-claude-code-bridge"
version = "1.6.0"
description = "Telegram bridge for Claude Code with topic-scoped sessions and durable delivery"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Richard Atkinson", email = "richardatk01@gmail.com"},
]
maintainers = [
    {name = "Fernando Taricano"},
]
keywords = ["telegram", "bot", "claude-code", "ai", "development", "remote", "coding", "bridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development",
    "Topic :: System :: Shells",
]
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[rate-limiter]>=22.6,<23",
    "structlog>=25.4.0,<26",
    "pydantic>=2.11.5,<3",
    "pydantic-settings>=2.9.1,<3",
    "python-dotenv>=1.0.0,<2",
    "aiofiles>=24.1.0,<25",
    "aiosqlite>=0.21.0,<0.22",
    "anthropic>=0.40.0,<0.41",
    "claude-agent-sdk>=0.1.39,<0.2",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "apscheduler>=3.10,<4",
    "PyYAML>=6.0.2,<7",
    "markdown-it-py>=4.2.0,<5",
]

[project.optional-dependencies]
voice = [
    "mistralai>=1.0.0,<2",
    "openai>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/ftaricano/telegram-claude-code-bridge"
Repository = "https://github.com/ftaricano/telegram-claude-code-bridge"
Documentation = "https://github.com/ftaricano/telegram-claude-code-bridge/blob/main/docs/"

[project.scripts]
telegram-claude-code-bridge = "src.main:run"
claude-code-telegram = "src.main:run"
claude-telegram-bot = "src.main:run"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-asyncio>=1.0.0,<2",
    "pytest-cov>=6.1.1,<7",
    "pytest-mock>=3.14.1,<4",
    "black>=25.1.0,<26",
    "isort>=6.0.1,<7",
    "flake8>=7.2.0,<8",
    "mypy>=1.16.0,<2",
    "autoflake>=2.3.2,<3",
    "pre-commit>=4.0.0,<5",
    "watchfiles>=1.1.1,<2",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
